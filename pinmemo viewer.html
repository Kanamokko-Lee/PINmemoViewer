<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PINmemo Viewer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    background: #1c1c1e;
    color: #f2f2f7;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* Sidebar */
  #sidebar {
    width: 200px;
    min-width: 200px;
    background: #2c2c2e;
    border-right: 1px solid #3a3a3c;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }
  #sidebar h2 {
    font-size: 13px;
    font-weight: 600;
    color: #8e8e93;
    padding: 16px 16px 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .airport-item {
    padding: 12px 16px;
    cursor: pointer;
    border-bottom: 1px solid #3a3a3c;
    font-size: 15px;
    transition: background 0.15s;
  }
  .airport-item:hover { background: #3a3a3c; }
  .airport-item.active { background: #0a84ff; color: white; }
  .airport-item .airport-id {
    font-size: 11px;
    color: #8e8e93;
    margin-top: 2px;
  }
  .airport-item.active .airport-id { color: rgba(255,255,255,0.7); }

  /* Main content */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #toolbar {
    padding: 12px 20px;
    background: #2c2c2e;
    border-bottom: 1px solid #3a3a3c;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  #toolbar input {
    flex: 1;
    background: #3a3a3c;
    border: none;
    border-radius: 8px;
    padding: 8px 12px;
    color: #f2f2f7;
    font-size: 14px;
    outline: none;
  }
  #toolbar input::placeholder { color: #636366; }
  #load-btn {
    background: #0a84ff;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
  }
  #load-btn:hover { background: #0070d8; }
  #status {
    font-size: 12px;
    color: #8e8e93;
    white-space: nowrap;
  }

  #content {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
  }
  #airport-name {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  #airport-meta {
    font-size: 12px;
    color: #8e8e93;
    margin-bottom: 20px;
  }
  #airport-body {
    font-size: 16px;
    line-height: 1.8;
    background: #2c2c2e;
    border-radius: 12px;
    padding: 20px;
  }
  /* Watch lines highlight */
  .watch-line {
    border-left: 3px solid #30d158;
    padding-left: 8px;
    margin-left: -11px;
  }
  #watch-legend {
    margin-top: 16px;
    font-size: 12px;
    color: #30d158;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #watch-legend::before {
    content: '';
    display: inline-block;
    width: 12px;
    height: 12px;
    border-left: 3px solid #30d158;
  }

  #empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: #636366;
    gap: 8px;
  }
  #empty-state .icon { font-size: 48px; }

  /* Token input */
  #token-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 20px;
    background: #2c2c2e;
    border-bottom: 1px solid #3a3a3c;
  }
  #token-row label { font-size: 12px; color: #8e8e93; white-space: nowrap; }
  #token-input {
    flex: 1;
    background: #3a3a3c;
    border: none;
    border-radius: 6px;
    padding: 6px 10px;
    color: #f2f2f7;
    font-size: 13px;
    outline: none;
    font-family: monospace;
  }
</style>
</head>
<body>

<div id="sidebar">
  <h2>空港</h2>
  <div id="airport-list"></div>
</div>

<div id="main">
  <div id="toolbar">
    <input type="text" id="gist-id" placeholder="Gist ID" value="ae9f42ecc9083c9591938a0676f7b64b">
    <button id="load-btn" onclick="loadGist()">読み込む</button>
    <span id="status"></span>
  </div>
  <div id="token-row">
    <label>GitHub Token (任意):</label>
    <input type="password" id="token-input" placeholder="ghp_xxxx... (プライベートGistの場合)">
  </div>
  <div id="content">
    <div id="empty-state">
      <div class="icon">🔐</div>
      <div>Gist IDを入力して「読み込む」を押してください</div>
    </div>
    <div id="airport-detail" style="display:none">
      <div id="airport-name"></div>
      <div id="airport-meta"></div>
      <div id="airport-body"></div>
      <div id="watch-legend">Watch表示行</div>
    </div>
  </div>
</div>

<script>
let airports = [];
let selectedIndex = 0;

async function loadGist() {
  const gistId = document.getElementById('gist-id').value.trim();
  const token = document.getElementById('token-input').value.trim();
  const status = document.getElementById('status');

  if (!gistId) return;

  status.textContent = '読み込み中...';

  const headers = { 'Accept': 'application/vnd.github.v3+json' };
  if (token) headers['Authorization'] = `token ${token}`;

  try {
    const res = await fetch(`https://api.github.com/gists/${gistId}`, { headers });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const gist = await res.json();

    // Find the airports HTML file
    const fileKey = Object.keys(gist.files).find(k => k.endsWith('.html'));
    if (!fileKey) throw new Error('HTMLファイルが見つかりません');

    const html = gist.files[fileKey].content;
    airports = parseAirports(html);

    renderSidebar();
    if (airports.length > 0) selectAirport(0);

    const updatedAt = new Date(gist.updated_at).toLocaleString('ja-JP');
    status.textContent = `${airports.length}空港 · 更新: ${updatedAt}`;
  } catch (e) {
    status.textContent = `エラー: ${e.message}`;
    console.error(e);
  }
}

function parseAirports(html) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(html, 'text/html');
  const divs = doc.querySelectorAll('.airport');
  return Array.from(divs).map(div => ({
    id: div.dataset.id || '',
    name: div.dataset.name || div.dataset.id || '',
    lat: parseFloat(div.dataset.lat || '0'),
    lon: parseFloat(div.dataset.lon || '0'),
    updated: div.dataset.updated || '',
    watchLineIndices: (div.dataset.watchLines || '')
      .split(',').map(s => parseInt(s)).filter(n => !isNaN(n)),
    body: div.querySelector('.body')?.innerHTML || ''
  }));
}

function renderSidebar() {
  const list = document.getElementById('airport-list');
  list.innerHTML = airports.map((a, i) => `
    <div class="airport-item" onclick="selectAirport(${i})">
      ${a.name}
      <div class="airport-id">${a.id}</div>
    </div>
  `).join('');
}

function selectAirport(index) {
  selectedIndex = index;

  // Update sidebar active state
  document.querySelectorAll('.airport-item').forEach((el, i) => {
    el.classList.toggle('active', i === index);
  });

  const airport = airports[index];
  document.getElementById('empty-state').style.display = 'none';
  document.getElementById('airport-detail').style.display = 'block';
  document.getElementById('airport-name').textContent = airport.name;

  const updated = airport.updated
    ? new Date(airport.updated).toLocaleString('ja-JP')
    : '不明';
  document.getElementById('airport-meta').textContent =
    `${airport.id} · 更新: ${updated} · Watch行: ${airport.watchLineIndices.length > 0 ? airport.watchLineIndices.join(', ') : 'なし'}`;

  // Render body with watch line highlights
  const bodyEl = document.getElementById('airport-body');
  bodyEl.innerHTML = renderBodyWithWatchLines(airport.body, airport.watchLineIndices);
}

function renderBodyWithWatchLines(html, watchIndices) {
  if (!html) return '<span style="color:#636366">本文なし</span>';

  const parser = new DOMParser();
  const doc = parser.parseFromString(`<div>${html}</div>`, 'text/html');
  const container = doc.querySelector('div');
  const children = Array.from(container.children);

  if (children.length === 0) {
    // No block elements, return as-is
    return html;
  }

  return children.map((el, i) => {
    const isWatch = watchIndices.includes(i);
    const outer = document.createElement('div');
    if (isWatch) outer.className = 'watch-line';
    outer.innerHTML = el.outerHTML;
    return outer.outerHTML;
  }).join('');
}

// Auto-load on page open
window.onload = () => {
  const gistId = document.getElementById('gist-id').value.trim();
  if (gistId) loadGist();
};
</script>
</body>
</html>
